<!DOCTYPE html>
<html>
<head>
    <title>Overall SIP Analysis</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="container mt-5">

<h2 class="green-text mb-4">Overall SIP Timing Analysis</h2>

<div class="row mb-4">

    <div class="col-md-4">
        <div class="card p-3 bg-white">
            <h5>Best SIP Day</h5>
            <h3 class="green-text">Day {{ best_day }}</h3>
            <p>Avg CAGR: {{ best_cagr }}%</p>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card p-3 bg-white">
            <h5>Worst SIP Day</h5>
            <h3>Day {{ worst_day }}</h3>
            <p>Avg CAGR: {{ worst_cagr }}%</p>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card p-3 bg-white">
            <h5>Performance Gap</h5>
            <h3 class="green-text">{{ gap }}%</h3>
        </div>
    </div>

</div>

<div class="card p-4 bg-white">
    <canvas id="overallChart"></canvas>
</div>

<script>
    const bestDay = {{ best_day }};
    const days = {{ days | safe }};
    const cagrs = {{ cagrs | safe }};

    new Chart(document.getElementById("overallChart"), {
        type: 'line',
        data: {
            labels: days,
            datasets: [{
                label: 'Average CAGR %',
                data: cagrs,
                borderColor: '#0f9d58',
                backgroundColor: 'rgba(15,157,88,0.1)',
                borderWidth: 3,
                pointBackgroundColor: days.map(d =>
                    d === bestDay ? '#ff0000' : '#0f9d58'
                ),
                pointRadius: days.map(d =>
                    d === bestDay ? 8 : 3
                )
            }]
        }
    });
</script>

<br>
<a href="/" class="btn btn-success">Back</a>

</body>
</html>
